name: CI

# The bundle is shell plus git hooks, so there is nothing to compile. What matters is that the scripts
# parse on both platforms the bundle claims to support, and that the commit hook actually refuses what
# it is supposed to refuse - the latter being the only thing that makes the hook worth installing.
on:
  # Branch pushes cover `main` and any long-lived branch; pull_request covers PR heads. Using `push:
  # branches: ["**"]` together with pull_request would run everything twice for every PR commit, so
  # push is limited to the default branch (PR branches are already covered by the PR event).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push makes an in-flight run obsolete, except on the default branch, where every commit is
# worth reporting on.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

# The gate is defined ONCE, in `scripts/verify`, and these jobs CALL it rather than re-listing the
# steps. That is the whole point: a CI job and a local instruction list maintained separately drift, and
# a change then passes one and fails the other. A check that should run here belongs in the script.
#
# The split is by cost, not by kind, so a trivial failure is reported in seconds instead of after the
# behavioural suite: `checks` is fast (no key, no network), `hooks` drives real repositories through the
# real hook files and takes minutes. Both must pass.
jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The bundle ships a macOS/Linux installer and the hook is plain git, so both are pinned rather
        # than assumed. ubuntu-latest is the required gate; macos-latest keeps the "works on macOS"
        # claim honest.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Fast checks
        shell: bash
        run: ./scripts/verify tools syntax install config version gateshapes coverage

  hooks:
    name: commit hook (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Commit-hook tests and selfcheck
        shell: bash
        # Offline cases only: the live-endpoint case needs a paid key, and CI must not depend on one.
        #
        # The selfcheck re-runs the same suite against a neutered hook and requires that exactly the
        # enforcement-sensitive cases fail. Without it, a case that claims to test enforcement but
        # passes with the hook disabled would go unnoticed - the suite would still be green.
        run: ./scripts/verify hooktests selfcheck

  actionlint:
    name: workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A pinned static binary, so the lint result is reproducible. Kept out of `scripts/verify`'s
      # required path because the binary is not always present; verify runs it when it is and says so
      # when it is not.
      - name: Run actionlint
        run: |
          version=1.7.12
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
